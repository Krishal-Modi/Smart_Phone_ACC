<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Frequency Counter - SmartPhone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(to bottom, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .main-card {
            max-width: 800px;
            margin: 0 auto;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }
        .count-display {
            font-size: 4rem;
            font-weight: 700;
            margin: 20px 0;
        }
        .btn-analyze {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 40px;
            font-weight: 600;
        }
        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }
        .example-links {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .example-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .example-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card main-card">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">
                    <i class="bi bi-bar-chart-fill text-primary"></i>
                    Word Frequency Counter
                </h2>
                <p class="text-muted text-center mb-4">
                    Analyze how many times a specific word appears on any webpage
                </p>

                <form id="frequencyForm">
                    <div class="mb-4">
                        <label for="url" class="form-label fw-bold">
                            <i class="bi bi-link-45deg"></i> Webpage URL
                        </label>
                        <input type="url" 
                               class="form-control form-control-lg" 
                               id="url" 
                               placeholder="https://example.com/page"
                               required>
                        <div class="example-links mt-2">
                            <small class="text-muted">Try these examples:</small><br>
                            <a href="#" class="example-url" data-url="https://www.samsung.com/ca/smartphones/galaxy-s24/">Samsung Galaxy S24</a> |
                            <a href="#" class="example-url" data-url="https://www.apple.com/ca/iphone-15-pro/">iPhone 15 Pro</a> |
                            <a href="#" class="example-url" data-url="https://www.oneplus.com/ca_en/12">OnePlus 12</a>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="word" class="form-label fw-bold">
                            <i class="bi bi-search"></i> Search Word
                        </label>
                        <input type="text" 
                               class="form-control form-control-lg" 
                               id="word" 
                               placeholder="e.g., camera, 5G, display"
                               required>
                        <small class="text-muted">Case-insensitive search</small>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg btn-analyze">
                            <i class="bi bi-calculator"></i> Analyze Frequency
                        </button>
                    </div>
                </form>

                <div id="loadingDiv" class="text-center mt-4" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Analyzing webpage...</p>
                </div>

                <div id="resultDiv" style="display: none;"></div>

                <div class="mt-5 pt-4 border-top">
                    <a href="/dashboard" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Example URL click handler
        document.querySelectorAll('.example-url').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('url').value = this.dataset.url;
            });
        });

        // Form submission
        document.getElementById('frequencyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const url = document.getElementById('url').value.trim();
            const word = document.getElementById('word').value.trim();
            
            if (!url || !word) {
                alert('Please fill in both URL and word fields');
                return;
            }

            // Show loading
            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('resultDiv').style.display = 'none';

            // Call API
            fetch(`/api/word-frequency?url=${encodeURIComponent(url)}&word=${encodeURIComponent(word)}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loadingDiv').style.display = 'none';
                    
                    if (data.success) {
                        document.getElementById('resultDiv').innerHTML = `
                            <div class="result-box">
                                <i class="bi bi-check-circle" style="font-size: 3rem;"></i>
                                <div class="count-display">${data.count}</div>
                                <h4>Occurrences Found</h4>
                                <p class="mb-0">The word "<strong>${data.word}</strong>" appears <strong>${data.count} times</strong></p>
                                <small class="d-block mt-3 opacity-75">on ${data.url}</small>
                            </div>
                        `;
                    } else {
                        document.getElementById('resultDiv').innerHTML = `
                            <div class="alert alert-danger mt-4">
                                <i class="bi bi-exclamation-triangle"></i>
                                <strong>Error:</strong> ${data.error || 'Failed to analyze URL'}
                            </div>
                        `;
                    }
                    
                    document.getElementById('resultDiv').style.display = 'block';
                })
                .catch(error => {
                    document.getElementById('loadingDiv').style.display = 'none';
                    document.getElementById('resultDiv').innerHTML = `
                        <div class="alert alert-danger mt-4">
                            <i class="bi bi-x-circle"></i>
                            <strong>Error:</strong> Failed to connect to server. Please try again.
                        </div>
                    `;
                    document.getElementById('resultDiv').style.display = 'block';
                });
        });
    </script>
</body>
</html>
