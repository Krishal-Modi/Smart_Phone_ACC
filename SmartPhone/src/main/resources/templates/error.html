<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error - SmartPhone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .error-container {
        max-width: 600px;
        width: 100%;
      }
      .error-icon {
        font-size: 5rem;
        color: #dc3545;
      }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-container mx-auto">
            <div class="card shadow-lg border-0">
                <div class="card-body text-center p-5">
                    <i class="bi bi-exclamation-triangle-fill error-icon mb-4"></i>
                    <h2 class="mb-3" th:text="${errorTitle} ?: 'Error Occurred'">Error Occurred</h2>
                    <p class="lead mb-3" th:text="${errorMessage} ?: 'Something went wrong'">Something went wrong</p>
                    <p class="text-muted mb-4" th:text="${errorDetails} ?: 'Please try again later'">Please try again later</p>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="/dashboard" class="btn btn-primary btn-lg">
                            <i class="bi bi-house-door"></i> Return to Dashboard
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary btn-lg">
                            <i class="bi bi-arrow-left"></i> Go Back
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <p class="text-white">
                    <i class="bi bi-headset"></i> Need help? 
                    <a href="mailto:support@smartphone.com" class="text-white fw-bold">Contact Support</a>
                </p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
